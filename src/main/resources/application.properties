spring.application.name=pc27747u20241f027

# Server
server.port=8080

# Datasource
spring.datasource.url=jdbc:mysql://localhost:8080/campus_lab?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA & Physical Naming Strategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=mysql
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=com.campuslab.platform.u20241f027.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Internationalization i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api/v1/equipment-reservations
springdoc.swagger-ui.path=/swagger-ui.html
